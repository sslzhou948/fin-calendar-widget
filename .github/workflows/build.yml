# ============================================================================
# ⚠️ 此文件必须由用户亲手上传到 GitHub ⚠️
# ----------------------------------------------------------------------------
# 请通过 GitHub 网页端手动创建本文件：
#   仓库页面 → Add file → Create new file → 路径填写
#   .github/workflows/build.yml → 粘贴本文件全部内容 → Commit。
#
# 原因：GitHub App（meta-muse-ai）向 `.github/workflows/*` 推送会被固定 403
# 拒绝——这是 GitHub 的平台限制（subwrap 项目已验证），Muse 无法代传。
# 用 git 命令行直接 push 同样会被拒绝，只有网页端手动创建/编辑才行。
# ============================================================================

name: Build FinCalendarWidget

on:
  # 手动触发：只构建 + 上传 artifacts，不发 release
  workflow_dispatch:
  # 打 tag 触发：构建 + 上传 artifacts + 发布 GitHub Release
  # 用法：git tag v0.1.0 && git push origin v0.1.0
  push:
    tags:
      - "v*"

jobs:
  # -------------------------------------------------------------------------
  # test：真机自动化测试门禁。build 依赖 test 全绿（PRD §7.11 CI 闭环）。
  # 说明：tauri-driver WebDriver 交互测试已评估——windows-latest runner
  # 无交互式桌面会话，透明置底/点击穿透等行为无法被 WebDriver 有效验证，
  # 且引入 flaky 风险；故降级为"编译（build job）+ 数据层单测 + 前端语法
  # 检查 + 无头渲染截图"，均为确定性检查。真机交互/视觉最终确认在用户本机。
  # -------------------------------------------------------------------------
  test:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Rust data-layer tests (caldata)
        shell: bash
        # 注：src-tauri 整包需 GUI 依赖，单测只跑纯 Rust 数据层；
        # 完整编译在 build job 中验证。
        run: cargo test --manifest-path crates/caldata/Cargo.toml

      - name: Frontend syntax check
        shell: bash
        run: |
          node --check src/app.js
          node --check src/settings.js
          node --check scripts/screenshot.mjs

      - name: Install screenshot deps
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Smoke test Tauri bridge
        shell: bash
        run: |
          echo "=== 检查 withGlobalTauri ==="
          python3 -c "
          import json, sys
          with open('src-tauri/tauri.conf.json') as f:
              c = json.load(f)
          v = c.get('app', {}).get('withGlobalTauri', False)
          print('withGlobalTauri =', v)
          sys.exit(0 if v is True else 1)
          "
          echo "=== 检查前端无残留引用 ==="
          ! grep -rn "p-quote\|dayQuote" src/index.html src/app.js && echo "无格言残留 OK"
          echo "=== 检查取色器 data-key ==="
          test $(grep -c 'data-color-key' src/settings.html) -eq 7 && echo "7 个取色器接线 OK"

      - name: Render screenshots (headless Chrome)
        shell: bash
        env:
          # 脚本需支持 CHROME_PATH 环境变量覆盖 chromium 路径
          # （见 scripts/screenshot.mjs 顶部注释）
          CHROME_PATH: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        run: node scripts/screenshot.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: FinCalendarWidget-screenshots
          if-no-files-found: error
          path: docs/screenshots/*.png

  build:
    name: Build (${{ matrix.os }})
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：msi（企业分发）+ nsis（经典安装向导）
          - os: windows-latest
            bundles: "--bundles msi,nsis"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Generate app icons
        # 图标为二进制文件，无法经 GitHub App 推送到仓库；
        # 改为在构建时用纯 Node 脚本现场生成，再用 tauri icon 产出全套尺寸。
        shell: bash
        run: |
          node scripts/generate-icons.mjs
          # 注意：必须显式写 @tauri-apps/cli。bare `npx tauri` 会去拉 npm 上
          # 同名的占位包（无可执行文件）而报 "could not determine executable"。
          npx --yes @tauri-apps/cli icon src-tauri/icons/icon.png --output src-tauri/icons

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          # tag 触发时自动把安装包上传到对应 GitHub Release；
          # workflow_dispatch 时无 tag 上下文，仅构建。
          # releaseDraft: true 让 tag 构建先生成草稿 release，由用户检查后手动发布。
          releaseDraft: true
          args: ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinCalendarWidget-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
