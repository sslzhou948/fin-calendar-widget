# ============================================================================
# 构建工作流（手动 Run workflow 或打 v* tag 触发）
# 历史注记：早期经 GitHub App（连接器）推送本文件会被平台 403；2026-10-23
# 起改走账号级 SSH 密钥 + 本地 git 推送，已验证可正常推送本文件。
# ============================================================================

name: Build FinCalendarWidget

on:
  # 手动触发：只构建 + 上传 artifacts，不发 release
  workflow_dispatch:
  # 打 tag 触发：构建 + 上传 artifacts + 发布 GitHub Release
  # 用法：git tag v0.1.0 && git push origin v0.1.0
  push:
    tags:
      - "v*"

jobs:
  # -------------------------------------------------------------------------
  # test：真机自动化测试门禁。build 依赖 test 全绿（PRD §7.11 CI 闭环）。
  # 说明：tauri-driver WebDriver 交互测试已评估——windows-latest runner
  # 无交互式桌面会话，透明置底/点击穿透等行为无法被 WebDriver 有效验证，
  # 且引入 flaky 风险；故降级为"编译（build job）+ 数据层单测 + 前端语法
  # 检查"，均为确定性检查。无头渲染截图制品已于 2026-10-23 移除（合成图
  # 非实机图、且 Chrome 冷启动抖动曾卡住整条流水线）；真机交互/视觉确认
  # 走 v100 测试机 RDP 回归与用户本机终审。
  # -------------------------------------------------------------------------
  test:
    name: Test (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Rust data-layer tests (caldata)
        shell: bash
        # 注：src-tauri 整包需 GUI 依赖，单测只跑纯 Rust 数据层；
        # 完整编译在 build job 中验证。
        run: cargo test --manifest-path crates/caldata/Cargo.toml

      - name: Frontend syntax check
        shell: bash
        run: |
          node --check src/app.js
          node --check src/settings.js
          node --check scripts/screenshot.mjs

  build:
    name: Build (${{ matrix.os }})
    needs: [test]
    # tauri-action 需要写权限才能在 tag 构建时创建 Release 并上传资产；
    # 仓库默认 GITHUB_TOKEN 为只读时该步会被静默跳过（v0.2.0 实证无草稿）。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：msi（企业分发）+ nsis（经典安装向导）
          - os: windows-latest
            bundles: "--bundles msi,nsis"
          # macOS：dmg（macos-latest 为 arm64 runner，产物为 aarch64；
          # 如需 x86_64/universal，后续再加 --target 矩阵）
          - os: macos-latest
            bundles: "--bundles dmg"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Generate app icons
        # 图标为二进制文件，无法经 GitHub App 推送到仓库；
        # 改为在构建时用纯 Node 脚本现场生成，再用 tauri icon 产出全套尺寸。
        shell: bash
        run: |
          node scripts/generate-icons.mjs
          # 注意：必须显式写 @tauri-apps/cli。bare `npx tauri` 会去拉 npm 上
          # 同名的占位包（无可执行文件）而报 "could not determine executable"。
          npx --yes @tauri-apps/cli icon src-tauri/icons/icon.png --output src-tauri/icons

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src-tauri
          # tag 触发时自动把安装包上传到对应 GitHub Release；
          # workflow_dispatch 时无 tag 上下文，仅构建。
          # releaseDraft: true 让 tag 构建先生成草稿 release，由用户检查后手动发布。
          releaseDraft: true
          args: ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinCalendarWidget-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg

      # #17 教训（2026-10-26）：含多个安装器的合包 zip 是 Chrome 危险下载
      # 拦截的重灾区（v0.2.0 与诊断版两次复发）。另传一个只含 NSIS exe 的
      # 单文件 artifact，用户下载时只下它；合包保留（MSI 供企业分发）。
      # 注意：GitHub artifact 下载恒为 zip，单 exe 只能把警告变软、不能根除
      # （未签名 + 下载量极少仍可能出“不常见”提示，届时点“保留”即可）。
      - name: Upload setup exe only
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FinCalendarWidget-setup-exe
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
