[package]
name = "caldata"
version = "0.1.0"
edition = "2021"
description = "桌面财经日历挂件 — 纯 Rust 数据层（禁止依赖 Tauri，可独立 cargo test）"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
# rustls-tls 而非 default-tls：避免依赖系统 openssl，便于跨平台构建
# json：Faireconomy 源用 resp.json() 解析
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.20"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync"] }
async-trait = "0.1"
# 金十 WebSocket 源（jin10.rs）：rustls 与 reqwest 同栈，避免 native-tls/openssl
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
