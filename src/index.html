<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经日历</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="panel">
    <header class="p-head">
      <div class="p-title-wrap">
        <span class="p-title">财经日历 · 未来一周</span>
        <span class="p-sub">北京时间 · 透明悬浮蒙层</span>
      </div>
      <span class="p-quote" id="p-quote"></span>
    </header>
    <div id="p-err" hidden></div>
    <div id="groups"></div>
    <div id="empty" hidden>暂无符合条件的日历事件</div>
    <footer class="p-foot">
      <span class="p-note">事件驱动刷新 · 每周日 00:00(北京时间)全量更新 · 开机自动对账</span>
      <span class="legend"><i class="dot dev-beat"></i>超预期<i class="dot dev-miss"></i>低预期<i class="dot dev-inline"></i>符合预期</span>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
