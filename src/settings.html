<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财经日历 — 设置</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="settings">
<div class="s-wrap">
  <h1>财经日历 · 设置</h1>
  <p class="desc">改动会立即在挂件上预览；点「应用」保存，点「取消」恢复打开设置时的状态。</p>

  <div class="s-card">
    <h2>国家 / 地区</h2>
    <div class="s-row" id="countries"></div>
  </div>

  <div class="s-card">
    <h2>显示与位置</h2>
    <div class="s-row">
      <span class="name">星级阈值</span>
      <select id="minStars">
        <option value="1">1 星及以上（全看）</option>
        <option value="2">2 星及以上</option>
        <option value="3" selected>3 星及以上（默认）</option>
        <option value="4">4 星及以上</option>
        <option value="5">只看 5 星</option>
      </select>
    </div>
    <div class="s-row">
      <span class="name">半屏位置</span>
      <label class="item"><input type="radio" name="side" value="right" checked> 右半屏（默认）</label>
      <label class="item"><input type="radio" name="side" value="left"> 左半屏</label>
    </div>
    <div class="s-row">
      <span class="name">面板宽度</span>
      <label class="item"><input type="radio" name="widthMode" value="auto" checked> 自适应（按内容列数）</label>
      <label class="item"><input type="radio" name="widthMode" value="manual"> 手动列数</label>
      <select id="manualColumns">
        <option value="1">1 列</option>
        <option value="2">2 列</option>
        <option value="3">3 列</option>
        <option value="4">4 列</option>
        <option value="5">5 列</option>
        <option value="6">6 列</option>
      </select>
      <span class="note" style="color:var(--muted);font-size:12px">高度恒占满屏幕；宽度按整列计算，不会出现半列</span>
    </div>
    <div class="s-row">
      <span class="name">字号</span>
      <input type="range" id="fontSize" min="12" max="18" step="1" value="14">
      <span class="range-val" id="fontSizeVal">14 px</span>
    </div>
    <div class="s-row">
      <label class="item"><input type="checkbox" id="frosted" checked> 毛玻璃面板（默认开）</label>
    </div>
    <div class="s-row">
      <label class="lbl">背景不透明度</label>
      <input type="range" id="frostOpacity" min="0" max="100" value="70" class="slider">
      <span class="val" id="frostOpacityVal">70%</span>
      <div class="hint">数值越高背景越实，文字越清晰（默认 70%）</div>
    </div>
    <div class="s-row">
      <label class="item"><input type="checkbox" id="notify" checked> 数据公布通知（实际值出来时，默认开）</label>
    </div>
    <div class="s-row">
      <label class="item"><input type="checkbox" id="autostart" checked> 开机自启动（默认开；关闭后不再自动随系统启动）</label>
    </div>
    <div class="s-row">
      <label class="item"><input type="checkbox" id="usdMode"> 美元口径利多利空着色（默认关）</label>
    </div>
    <div class="s-row">
      <label class="item"><input type="checkbox" id="notifyEvents"> 事件到点提醒（讲话·会议类，默认关，与数据通知互相独立）</label>
    </div>
    <div class="s-row">
      <label class="item"><input type="checkbox" id="hideHolidays"> 隐藏假期行（默认关）</label>
    </div>
    <div class="s-row">
      <span class="name">数据源</span>
      <select id="source">
        <option value="auto" selected>自动（金十 → Faireconomy 降级）</option>
        <option value="primary">主数据源（仅金十）</option>
      </select>
    </div>
  </div>

  <div class="s-card">
    <h2>颜色自定义</h2>
    <div class="s-row">
      <span class="name">时间</span>
      <input type="color" id="cTime" data-color-key="time" value="#f0a832">
      <span class="name">星级</span>
      <input type="color" id="cStars" data-color-key="stars" value="#ffd166">
    </div>
    <div class="s-row">
      <span class="name">超预期</span>
      <input type="color" id="cBeat" data-color-key="beat" value="#4ade80">
      <span class="name">低预期</span>
      <input type="color" id="cMiss" data-color-key="miss" value="#f87171">
      <span class="name">符合预期</span>
      <input type="color" id="cInline" data-color-key="inline" value="#9ca3af">
    </div>
    <div class="s-row">
      <span class="name">正文</span>
      <input type="color" id="cText" data-color-key="text" value="#eceff4">
      <span class="name">次要文字</span>
      <input type="color" id="cMuted" data-color-key="muted" value="#9aa4b5">
    </div>
    <div class="s-row">
      <button class="btn" id="resetColorsBtn">恢复默认颜色</button>
    </div>
  </div>

  <div class="s-card">
    <h2>接口测试 / 诊断</h2>
    <div class="s-row">
      <button class="btn" id="testBtn">接口测试</button>
      <button class="btn" id="testActualsBtn">实际值回填测试</button>
      <span class="note" style="color:var(--muted);font-size:12px">测试各数据源的连通性、延迟与解析情况；实际值测试验证当前数据源链的实际值覆盖</span>
    </div>
    <div id="testResult"></div>
    <div id="actualsResult"></div>
    <div class="s-row">
      <button class="btn" id="pinDiagBtn">桌面挂靠诊断</button>
      <span class="note" style="color:var(--muted);font-size:12px">显示当前挂靠状态与最近步骤（#17 诊断用）。若没有这个按钮，说明运行的是旧包</span>
    </div>
    <div id="pinDiagResult"></div>
  </div>

  <div class="s-btns">
    <button class="btn primary" id="applyBtn">应用</button>
    <button class="btn" id="cancelBtn">取消</button>
    <span id="saveTip" hidden>已应用 ✓</span>
  </div>
</div>
<script src="settings.js"></script>
</body>
</html>
